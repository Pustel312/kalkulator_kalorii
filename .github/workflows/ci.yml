name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code with Ruff
        run: ruff check .
    
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgresuser1:postgrespassword1@localhost:5432/calorie_app_test
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''        
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

    services: 
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgresuser1
          POSTGRES_PASSWORD: postgrespassword1
          POSTGRES_DB: calorie_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgresuser1 -d calorie_app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

  Alembic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Alembic
        env:
          DATABASE_URL: postgresql+psycopg://postgresuser1:postgrespassword1@localhost:5432/calorie_app_test
        run: alembic upgrade head

    services: 
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgresuser1
          POSTGRES_PASSWORD: postgrespassword1
          POSTGRES_DB: calorie_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgresuser1 -d calorie_app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5